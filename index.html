<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계획대로, 지하철</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --line:#00A84D; --line-d:#007a38; --ink:#14181c; --paper:#F3F0E8; --card:#fffdf7;
  --warn:#F2B705; --bad:#E5484D; --pink:#F29BC1; --mute:#7b8187;
  --font:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:1280px;height:720px;transform-origin:center center;background:#0d1013;overflow:hidden;flex:none}
canvas{position:absolute;inset:0;width:1280px;height:720px;display:block}
button{font-family:inherit;cursor:pointer}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#top{position:absolute;left:24px;right:24px;top:16px;display:flex;gap:14px;align-items:stretch}
.plate{background:var(--card);border-radius:10px;padding:10px 14px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
#dayplate{display:flex;align-items:center;gap:10px;min-width:170px}
#roundel{width:38px;height:38px;border-radius:50%;background:var(--line);color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;flex:none}
#dayplate b{display:block;font-size:17px;line-height:1.15}
#dayplate small{color:var(--mute);font-size:12px}
#routeplate{flex:1;padding:8px 18px 6px}
#led{font-size:13px;color:#ffb22e;background:#1a1410;border-radius:5px;padding:4px 10px;height:24px;overflow:hidden;white-space:nowrap;letter-spacing:.02em}
#route{display:flex;align-items:flex-start;margin-top:8px;position:relative}
#route:before{content:"";position:absolute;left:8px;right:8px;top:6px;height:5px;background:var(--line);border-radius:3px}
.stop{flex:1;text-align:center;font-size:11.5px;color:var(--mute);position:relative;padding-top:18px}
.stop:first-child{text-align:left;flex:.5}.stop:last-child{text-align:right;flex:.5}
.stop i{position:absolute;top:1px;left:50%;margin-left:-8px;width:15px;height:15px;border-radius:50%;background:#fff;border:3.5px solid var(--line)}
.stop:first-child i{left:0;margin-left:0}.stop:last-child i{left:auto;right:0}
.stop.past{color:#b9bcbf}.stop.past i{background:var(--line)}
.stop.goal{color:var(--ink);font-weight:800}.stop.goal i{border-color:var(--ink);background:var(--ink)}.stop.goal em{font-style:normal;background:var(--ink);color:#fff;border-radius:4px;padding:0 5px;margin-left:3px;font-size:10.5px}
.stop.now{color:var(--ink);font-weight:800}.stop.now i{background:var(--warn);border-color:var(--ink);transform:scale(1.2)}
#meters{width:290px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.meter{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.meter span{width:34px}.meter em{font-style:normal;width:30px;text-align:right;font-variant-numeric:tabular-nums}
.bar{flex:1;height:11px;background:#e3dfd3;border-radius:6px;overflow:hidden}
.bar div{height:100%;width:50%;border-radius:6px;transition:width .15s linear}
#sbar{background:var(--line)}#sfat{position:absolute;right:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(135deg,#9aa0a6 0 4px,#b9bec3 4px 8px)}#nbar{background:var(--bad)}
#ptplate{min-width:96px;text-align:right}
#ptplate small{display:block;font-size:11px;color:var(--mute)}#ptplate b{font-size:22px;font-variant-numeric:tabular-nums}
#bottom{position:absolute;left:24px;right:24px;bottom:12px;display:flex;gap:8px;align-items:center;color:#f3f5f6;font-size:12.5px;font-weight:600;flex-wrap:wrap;background:rgba(14,17,20,.78);border-radius:10px;padding:5px 12px}
kbd{display:inline-block;background:#2a3036;border-radius:5px;padding:2px 7px;font:700 11.5px var(--font);color:#fff;border-bottom:2px solid #000;margin-right:3px}
#bottom span{margin-right:12px}
#planslots{margin-left:auto;color:#fff;font-weight:700}
#card{position:absolute;display:none;width:250px;background:var(--card);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.4);border-left:5px solid var(--line)}
#card b{font-size:14px;display:block;margin-bottom:2px}
#card .hint{color:var(--line-d);font-weight:700}#card .tell{color:#b25e00;font-weight:700}#card .fake{color:var(--mute)}
#card .stay{color:#8a5a9a;font-weight:700}#card .peek{color:#1f5fa8;font-weight:700}
#card .act{margin-top:5px;color:var(--mute);font-size:11.5px}
#banner{position:absolute;left:50%;top:112px;transform:translateX(-50%);background:var(--warn);color:var(--ink);font-weight:800;padding:7px 18px;border-radius:20px;font-size:15px;display:none;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#toasts{position:absolute;left:50%;top:526px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:rgba(20,24,28,.92);color:#fff;padding:7px 16px;border-radius:8px;font-size:14px;font-weight:600;animation:pop .25s ease-out}
.toast.good{background:var(--line)}.toast.bad{background:var(--bad)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#prompt{position:absolute;left:50%;top:112px;z-index:2;transform:translateX(-50%);background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:9px 18px;font-weight:800;font-size:15px;display:none}

/* Overlays */
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,16,19,.86)}
.overlay.on{display:flex}
.sheet{background:var(--paper);border-radius:16px;width:760px;max-height:660px;overflow:auto;padding:30px 36px;position:relative}
.sheet:before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--line);border-radius:16px 16px 0 0}
h1{font-size:44px;margin:6px 0 4px;letter-spacing:-.03em;line-height:1.05}
h1 span{color:var(--line)}
h2{font-size:25px;margin:4px 0 12px;letter-spacing:-.02em}
.sub{color:#565b60;font-size:15px;margin:0 0 20px;line-height:1.55}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.sheet>.btns:last-child{position:sticky;bottom:-30px;z-index:2;background:var(--paper);margin:12px -36px -30px;padding:12px 36px 18px;box-shadow:0 -6px 12px -8px rgba(0,0,0,.25)}   /* 긴 화면에서도 버튼이 늘 보이게 (개선점) */
.guide{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:12px}.guide div{background:var(--card);border-radius:10px;padding:10px 14px}.guide b{font-size:14.5px}.guide p{margin:4px 0 0;font-size:13px;line-height:1.55;color:#3a4148}
.btn{border:0;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:800;background:var(--ink);color:#fff;border-bottom:4px solid #000}
.btn.go{background:var(--line);border-bottom-color:var(--line-d)}
.btn.ghost{background:#e3dfd3;color:var(--ink);border-bottom-color:#c9c4b5}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tip{background:var(--card);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.tip b{display:block;font-size:14.5px;margin-bottom:2px}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.door{border:3px solid var(--ink);border-radius:12px;background:var(--card);padding:16px 8px 12px;text-align:center;font-weight:800;font-size:15px}
.door:hover{background:#fff;border-color:var(--line)}
.door .n{font-size:30px;display:block;line-height:1}
.door .c{display:inline-block;margin-top:8px;font-size:12.5px;padding:2px 10px;border-radius:10px;color:#fff}
.c0{background:var(--line)}.c1{background:#d99a00}.c2{background:var(--bad)}
.rows{background:var(--card);border-radius:10px;padding:6px 16px;font-size:15px}
.rows div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #d8d3c5}
.rows div:last-child{border:0;font-weight:800;font-size:18px}
.skill{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.skill .nm{width:120px;font-weight:800;font-size:15px}
.skill .pips{font-size:12px;color:var(--line);letter-spacing:2px;display:block}
.skill .ds{flex:1;font-size:13px;color:#565b60;line-height:1.4}
.skill .btn{padding:8px 14px;font-size:13.5px;min-width:86px}
.sline{border-left:6px solid var(--lc);padding:2px 0 4px 12px;margin:14px 0}
.sline .lh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.sline .ln{font-weight:900;font-size:17px;color:var(--lc)}
.sline .ld{font-size:12.5px;opacity:.75}
.sline .stops{display:flex;align-items:center;margin-left:auto}
.sline .stops i{width:10px;height:10px;border-radius:50%;border:2px solid var(--lc);background:transparent;margin-left:6px;position:relative}
.sline .stops i.on{background:var(--lc)}
.sline .stops i.x{width:14px;height:14px;border-width:3px;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.sline .lb{font-size:12.5px;opacity:.7;margin:1px 0}
.sline .lb.got{opacity:1;font-weight:700;color:var(--lc)}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tab{border:2px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:inherit}.tab.on{background:var(--line);color:#fff}
.bad{color:#c0392b;font-size:12.5px}
.eqs{margin:10px 0}.eqr{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.eqi{flex:1 1 200px;text-align:left;border:2px solid #d8dcd8;background:var(--card);border-radius:10px;padding:8px 12px;font:inherit;font-size:12.5px;line-height:1.4;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:inherit}.eqi b{font-size:14px}.eqi.on{border-color:var(--line);box-shadow:inset 0 0 0 1px var(--line)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}.wd{background:var(--card);border:2px solid #d8dcd8;border-radius:10px;padding:8px 6px;text-align:center;font-size:12.5px;line-height:1.35;position:relative;display:flex;flex-direction:column;gap:3px}
.wd b{font-size:15px}.wd small{opacity:.75}.wd i{font-style:normal;font-size:12px}.wd.now{border-color:var(--line)}.wd em{position:absolute;right:6px;top:4px;font-style:normal;font-weight:900;color:var(--line)}.wd.strike em{color:#E5484D}.wd.strike span{text-decoration:line-through}.wd.hol{background:#fff2f2}.wd.hol b,.wd .hn{color:#E5484D;opacity:1}
@media (max-width:560px){.week{grid-template-columns:repeat(4,1fr)}}
.ids{display:flex;flex-wrap:wrap;gap:12px}.idc{flex:1 1 220px;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid #d8dcd8;border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.idc.on{border-color:var(--line);box-shadow:0 0 0 2px var(--line)}.idc.locked{opacity:.55;cursor:default}
.idh{display:flex;gap:10px;align-items:center;font-size:12.5px;line-height:1.35}.idh b{font-size:16px}.ph{width:46px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;flex:none}
.ph.pimg{width:84px;height:110px;background:#e9ece8!important;overflow:hidden}.ph.pimg img{width:100%;height:100%;display:block}
.df{color:#c9a227;letter-spacing:1px}.idr{font-size:12.5px;font-weight:700}.idc svg{align-self:center}
.sts{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:11.5px;align-items:center}.sts i{height:7px;background:#e3e7e3;border-radius:4px;overflow:hidden}.sts em{display:block;height:100%;background:var(--line)}
.tr{font-size:12px;line-height:1.4}.bw{font-size:11.5px;opacity:.7}.lk{font-size:13px;font-weight:700;padding:20px 0}
.door .seats{font-size:12px;font-weight:700;opacity:.8}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:3px 10px;font-size:12.5px;font-weight:700;margin-bottom:8px}
.wallet{position:absolute;right:36px;top:30px;font-weight:800;font-size:16px}
#meltfx{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at center,rgba(20,24,28,0) 34%,rgba(20,24,28,.8) 76%)}
/* 출근 일기 */
.diary{position:relative;margin-top:14px;background:#fffdf5;border-radius:10px;border-left:5px solid var(--warn);padding:12px 16px 12px 18px;background-image:repeating-linear-gradient(transparent,transparent 29px,#e6ebe4 29px,#e6ebe4 30px);background-position:0 40px}
.diary .dh{font-size:12.5px;font-weight:800;color:#565b60;display:flex;justify-content:space-between;margin-bottom:6px}
.diary .dl{margin:0;font:25px/30px "Nanum Pen Script","Gaegu",var(--font);color:#1f2a44}
.diary .dt{color:#007a38}
.diary.shaky .dl:nth-child(odd){transform:rotate(-.6deg) translateX(3px)}.diary.shaky .dl:nth-child(even){transform:rotate(.7deg) translateX(-2px)}
.diary.cut .dl:nth-of-type(2){text-decoration:line-through;text-decoration-color:var(--bad)}
.diary .btn{position:absolute;right:10px;bottom:8px;padding:5px 12px;font-size:12.5px;border-bottom-width:3px}
/* 오늘의 계획표 */
#dplan{position:absolute;left:24px;top:120px;width:214px;display:none;background:var(--card);border-radius:10px;padding:8px 12px 9px;font-size:12.5px;line-height:1.5;box-shadow:0 2px 0 rgba(0,0,0,.35);border-left:5px solid var(--line)}
#dplan b{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mute);margin-bottom:2px}#dplan b kbd{font-size:10px;padding:0 4px}#dplan.fold{width:auto;padding:6px 12px}#dplan.fold b{margin:0}
#dplan div{display:flex;gap:6px;font-weight:700}
#dplan i{font-style:normal;width:14px;flex:none;text-align:center}
#dplan .done{color:var(--line-d)}#dplan .fail{color:var(--mute);text-decoration:line-through}#dplan .void{color:var(--mute)}
.plans{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid #d8d3c5;border-radius:12px;background:var(--card);padding:10px 14px;font-size:13.5px;color:#565b60}
.pl:hover{border-color:var(--line)}.pl.on{border-color:var(--line);background:#fff}
.pl .ck{width:24px;height:24px;border:2.5px solid var(--ink);border-radius:6px;flex:none;display:grid;place-items:center;font-weight:800;color:var(--line-d)}
.pl .pn{flex:1}.pl .pn b{display:block;font-size:15px;color:var(--ink)}
.pl .st{color:#d99a00;letter-spacing:1px;width:54px}.pl .pp{font-weight:800;color:var(--ink);width:46px;text-align:right}
/* 3D: 승객 카드는 화면 오른쪽 아래에 고정 */
body.v3d #card{left:auto!important;right:28px!important;top:auto!important;bottom:64px!important}
#lockhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,24,28,.82);color:#fff;font-weight:800;font-size:17px;padding:14px 22px;border-radius:12px;display:none;pointer-events:none}
/* ========== 인트로·타이틀 (추가 기획서 01, 시안 intro-flow.html) ========== */
#intro{position:absolute;inset:0;display:none;background:#000;overflow:hidden;cursor:pointer;color:#F3F0E8;z-index:5}
#intro.on{display:block}
#intro .cut{position:absolute;inset:0;animation:i-fade .45s}
@keyframes i-fade{from{opacity:0}}
#intro .cap{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:28px;font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#intro .skip{position:absolute;right:16px;bottom:12px;font-size:13px;color:rgba(255,255,255,.6)}
#intro .c1{background:radial-gradient(ellipse at 50% 70%,#1b2330 0%,#07090c 70%)}
#intro .phone{position:absolute;left:50%;top:50%;width:230px;height:434px;transform:translate(-50%,-50%) rotate(-8deg);background:#0c0f14;border:3px solid #2a3240;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#intro .phone .t{font-size:46px;font-weight:900;color:#e9f1ff;letter-spacing:-1px;animation:i-dim 3s forwards}
#intro .phone .a{font-size:13px;color:#8fa3bf}
#intro .phone .off{width:56%;padding:10px 0;border-radius:999px;background:#E5484D;color:#fff;font-weight:800;font-size:13px;text-align:center;animation:i-off 3s forwards}
#intro .hand{position:absolute;width:205px;height:158px;background:#e8b98f;border-radius:40% 40% 30% 30%;border:3px solid #14181c;transform:rotate(-30deg);animation:i-press 3s forwards}
@keyframes i-press{0%{left:70%;top:72%}55%,100%{left:50%;top:55%}}
@keyframes i-off{0%,54%{background:#E5484D}56%,100%{background:#3a4148}}
@keyframes i-dim{0%,56%{opacity:1}100%{opacity:.25}}
#intro .zz{position:absolute;left:12%;top:20%;font-size:15px;color:#56627a;line-height:1.6}
#intro .c2{background:#efe6d2}
#intro .planner{position:absolute;left:12%;top:8%;width:76%;height:84%;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.25);background:#fffdf3 repeating-linear-gradient(#fffdf3 0 55px,#c9dbe8 55px 57px);padding:18px 5% 18px 12%;font-family:"Nanum Pen Script",cursive;color:#1f2a44}
#intro .planner:before{content:"";position:absolute;left:8%;top:0;bottom:0;width:2px;background:#f0a0a0}
#intro .planner h3{margin:0;font-size:40px;font-weight:400;line-height:57px}
#intro .planner .row{font-size:34px;line-height:57px;white-space:nowrap}
#intro .planner .row b{font-weight:400;display:inline-block;width:5.2em}
#intro .mk{background:linear-gradient(transparent 55%,#fff27a 55%) no-repeat;background-size:0 100%;animation:i-mark 1.1s 1.2s forwards}
@keyframes i-mark{to{background-size:100% 100%}}
#intro .say{position:absolute;right:6%;bottom:8%;font-size:44px;color:#007a38;transform:rotate(-4deg)}
#intro .c3,#intro .t0{background:linear-gradient(#2a3038 0 18%,#c8cdd2 18% 70%,#8b9097 70%)}
#intro .psd{position:absolute;left:4%;right:4%;top:22%;height:46%;display:flex;gap:2%}
#intro .psd i{flex:1;border:4px solid #5c646d;background:rgba(160,200,230,.35);border-radius:4px}
#intro .train{position:absolute;top:24%;height:42%;width:140%;left:110%;border-radius:10px;opacity:.95;background:repeating-linear-gradient(90deg,transparent 0 6%,#2a3a48 6% 13%,transparent 13% 16%),#e9edf0}
#intro .train:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0 68%,#00A84D 68% 80%,transparent 80%)}
#intro .c3 .train{animation:i-arrive 3.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes i-arrive{from{left:110%}to{left:-20%}}
#intro .t0 .train{animation:i-pass 7s linear infinite}
@keyframes i-pass{0%{left:110%}45%,100%{left:-150%}}
#intro .led{position:absolute;left:30%;right:30%;top:5%;height:9%;background:#0b0d10;border:3px solid #3a4148;border-radius:6px;overflow:hidden;display:flex;align-items:center}
#intro .led span{white-space:nowrap;color:#ffb22e;font-weight:800;font-size:19px;padding-left:100%;animation:i-scroll 9s linear infinite}
@keyframes i-scroll{to{transform:translateX(-100%)}}
#intro .queue{position:absolute;left:6%;right:6%;bottom:10%;height:18%;display:flex;justify-content:space-around;align-items:flex-end}
#intro .queue b{width:3.4%;border-radius:40% 40% 10% 10%;background:var(--c);border:2px solid #14181c}
#intro .logo{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:74px;font-weight:900;color:#14181c;letter-spacing:-2px;text-shadow:0 3px 0 #fff;opacity:0;animation:i-logo 4s forwards}
#intro .logo span,#intro .sign .nm span{color:#00A84D}
@keyframes i-logo{0%,55%{opacity:0;transform:scale(.96)}75%,100%{opacity:1;transform:scale(1)}}
#intro .c4{background:#20262c}
#intro .car{position:absolute;inset:8% 10% 14%;background:#c7d4dd;border-radius:8px;overflow:hidden}
#intro .crowd{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:1%;padding:3%}
#intro .crowd b{width:7.4%;aspect-ratio:1/2.1;border-radius:45% 45% 12% 12%;background:var(--c);border:2px solid #14181c}

 ["신대방","seonam"],["구로디지털단지","seonam"],["대림","seonam",["7호선"],"B"],["신도림","seonam",["1호선"],"S"],["문래","seobu"],["영등포구청","seobu",["5호선"],"B"],["당산","seobu",["9호선"],"A",1.6],
 ["합정","sinchon",["6호선"],"A"],["홍대입구","sinchon",["공항철도","경의중앙선"],"S"],["신촌","sinchon"],["이대","sinchon"],["아현","dosim"],["충정로","dosim",["5호선"],"B"],
].map(([n,zone,tr,grade,gap])=>({n,zone,tr:tr||[],grade:grade||null,gap:gap||1}));   // 당산→합정(당산철교), 강변→잠실나루(잠실철교)는 한강을 건넌다
const ST=Object.fromEntries(LINE2.map((o,i)=>[o.n,Object.assign(o,{i})]));

function routeBetween(a,b){   // 순환선에서 짧은 방향으로 a → b. 같은 거리면 내선
  const L=LINE2.length,ia=ST[a].i,ib=ST[b].i,f=(ib-ia+L)%L,dir=f<=L-f?1:-1,n=Math.min(f,L-f),r=[];
  for(let k=0;k<=n;k++)r.push(LINE2[(ia+dir*k+L*2)%L].n);

}
const segGap=(a,b)=>{const A=ST[a],B=ST[b],L=LINE2.length;if(!A||!B)return 1;return (A.i+1)%L===B.i?A.gap:(B.i+1)%L===A.i?B.gap:1;};   // 두 역 사이 구간 길이 배수

const DAYS=["월요일","화요일","수요일","목요일","금요일","토요일","일요일"];
/* ========== 달력과 공휴일 (04, 2026-11-26 결정): 한 런은 실제 달력 위에서 흐른다. 기본 2026년. 개발용: 주소 뒤에 ?year=2027 (연도), &start=05-04 (시작 날짜) ========== */
const CAL_Q=(()=>{try{return new URLSearchParams(location.search);}catch(e){return null;}})();
let CAL_YEAR=(()=>{const y=CAL_Q&&+CAL_Q.get("year");return y>=1990&&y<=2100?y:2026;})();
let CAL_START=(()=>{const q=CAL_Q&&CAL_Q.get("start");return q&&/^\d{1,2}-\d{1,2}$/.test(q)?q:null;})();   // 개발용 시작 날짜 (MM-DD). 없으면 오늘
const LUNAR={2025:["01-29","05-05","10-06"],2026:["02-17","05-24","09-25"],2027:["02-07","05-13","09-15"]};   // 설날·부처님오신날·추석 당일 (월력요항 기준). 표에 없는 해는 양력 공휴일만
const EXTRA_HOL={"2025-01-27":"임시공휴일","2025-06-03":"대통령 선거일","2026-06-03":"지방선거일"};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const parseYmd=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10));

function holidaysOf(Y){   // 그해 공휴일 {"YYYY-MM-DD": 이름}. 대체공휴일: 설·추석은 일요일이나 다른 공휴일과 겹칠 때, 삼일절·어린이날·광복절·개천절·한글날·부처님오신날·성탄절은 토·일이나 다른 공휴일과 겹칠 때
  if(HOL_CACHE[Y])return HOL_CACHE[Y];
  const E={},H={},add=(k,n,t)=>{(E[k]||(E[k]=[])).push({n,t});},D=md=>new Date(Y,+md.slice(0,2)-1,+md.slice(3,5));
  const solar=[["01-01","신정",0],["03-01","삼일절","wk"],["05-05","어린이날","wk"],["06-06","현충일",0],["08-15","광복절","wk"],["10-03","개천절","wk"],["10-09","한글날","wk"],["12-25","성탄절","wk"]];
  if(Y>=2026)solar.push(["05-01","노동절",0],["07-17","제헌절",0]);   // 2026년부터 공휴일
  for(const [md,n,t] of solar)add(ymd(D(md)),n,t);
  const L=LUNAR[Y];
  if(L){for(const i of[0,2]){const c=D(L[i]);for(let k=-1;k<=1;k++)add(ymd(addDays(c,k)),i?"추석":"설날","lunar");}add(ymd(D(L[1])),"부처님오신날","wk");}
  for(const k in EXTRA_HOL)if(+k.slice(0,4)===Y)add(k,EXTRA_HOL[k],0);
  for(const k in E)H[k]=E[k].map(e=>e.n).filter((v,i,a)=>a.indexOf(v)===i).join("·");
  const off=d=>d.getDay()===0||d.getDay()===6||!!H[ymd(d)];
  for(const k of Object.keys(E).sort()){const d=parseYmd(k),es=E[k],wd=d.getDay(),dup=es.length>1;
    const need=es.some(e=>e.t==="wk")&&(wd===0||wd===6||dup)||es.some(e=>e.t==="lunar")&&(wd===0||dup);
    if(!need)continue;let x=addDays(d,1);while(off(x))x=addDays(x,1);
    const n=(es.find(e=>e.t)||es[0]).n;H[ymd(x)]="대체공휴일("+n+")";}
  return HOL_CACHE[Y]=H;
}
function calStart(){   // 1주차 월요일: 설정 연도에서 오늘(또는 start=)과 같은 날짜가 든 주
  const q=CAL_START,t=new Date();let m=t.getMonth()+1,dd=t.getDate();
  if(q){m=+q.split("-")[0];dd=+q.split("-")[1];}
  const d=new Date(CAL_YEAR,m-1,dd);return addDays(d,-((d.getDay()+6)%7));
}

const DIARY_BAD=["exhaust","nuis","swept","melt","stolen","planNone","caught","packhit","fake","stood","bump"],DIARY_GOOD=["planAll","planned","xferPlanned","nobump"];
const CLOCK0={am:7*60+14,pm:18*60+32,we:13*60+5};   // 가상 시각: 출근 07:14, 퇴근 18:32 출발. 역 사이 2분
function clock(){const g=G,m=Math.round(CLOCK0[g.legKey]+2*(g.st+(g.phase==="run"?Math.min(1,g.t/runT()):0)));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
function ev(k,o){const g=G;if(!g||!g.log)return;g.log.push(Object.assign({k,st:g.route[Math.min(g.N,g.st+(g.phase==="run"&&(k==="exhaust"||k==="nuis")?1:0))],time:clock()},o||{}));}
function josa(s){return s.replace(/(.)(」?)\{(은|이|을)\}/g,(m,ch,q,j)=>{const c=ch.charCodeAt(0),b=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28>0;return ch+q+{은:b?"은":"는",이:b?"이":"가",을:b?"을":"를"}[j];});}
function diaryPick(key,arr){   // 최근에 쓴 틀은 피한다 (틀 수의 절반까지 기억)
  const rec=profile.diaryRecent||(profile.diaryRecent={}),used=rec[key]||[];
  let c=arr.map((_,i)=>i).filter(i=>!used.includes(i));if(!c.length)c=arr.map((_,i)=>i);
  const i=pick(c);rec[key]=used.concat(i).slice(-Math.floor(arr.length/2));return arr[i];
}
const diaryFill=(t,o)=>josa(t.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m));
const modKind=m=>!m?"normal":m.radius?"rain":m.packed?"packed":m.crowd>1?"delay":m.crowd<1?"quiet":"normal";
function makeDiary(fail){
  const g=G,log=g.log.slice(),from=g.route[0],to=g.route[g.N];
  const add=(k,o)=>log.push(Object.assign({k,st:g.route[Math.min(g.st,g.N)],time:clock()},o||{}));
  if(fail==="exhaust"||fail==="nuis")ev(fail),log.push(g.log[g.log.length-1]);
  if(!fail){
    if(!g.everSat)add("stood",{n:g.N});
    if(g.bumps===0)add("nobump");
    const dc=g.dp.filter(d=>d.status!=="void"),dd=dc.filter(d=>d.status==="done"),df=dc.filter(d=>d.status==="fail");
    if(dc.length>=2&&dd.length===dc.length)add("planAll",{total:dc.length});
    else if(dc.length&&!dd.length)add("planNone",{total:dc.length});
    else if(dd.length&&df.length)add("planPart",{total:dc.length,done:dd.length,fail:df.length,doneName:dd[0].n,failName:df[0].n});
  }
  if(g.bumps>0)add("bump",{n:g.bumps,st:g.bump1||g.route[g.st]});
  // 종류별로 하나씩, 우선순위가 높은 순서로 2~3개
  const seen=new Set(),uniq=[];for(const e of log)if(DIARY[e.k]&&!seen.has(e.k)){seen.add(e.k);uniq.push(e);}
  uniq.sort((a,b)=>DIARY[a.k].pr-DIARY[b.k].pr);
  const chosen=uniq.slice(0,uniq.length>2&&DIARY[uniq[2].k].pr<=3?3:2).sort((a,b)=>log.indexOf(a)-log.indexOf(b));   // 고른 뒤에는 일어난 순서대로 적는다
  const lines=chosen.map(e=>diaryFill(diaryPick(e.k,DIARY[e.k].t),Object.assign({from,to,arch:"승객"},e,e.arch?{arch:DIARY_ARCH[e.arch]||"승객"}:{})));
  const am=g.legKey==="am",mk=modKind(g.mod);
  const lb=am?"출근":g.legKey==="we"&&run.appt?(run.appt.dir==="go"?"약속 가는 길":"귀갓길"):"퇴근",t0=CLOCK0[g.legKey]||CLOCK0.pm;   // 주말 약속 통근은 약속 시각 기준
  const head=DAYS[run.day]+" "+lb+". "+String(Math.floor(t0/60)).padStart(2,"0")+":"+String(t0%60).padStart(2,"0")+" "+from+" 출발. "+diaryPick("head_"+mk,DIARY_HEAD[mk]);
  const anyGood=DIARY_GOOD.some(k=>seen.has(k)),bad=DIARY_BAD.find(k=>seen.has(k)&&(k==="bump"?g.bumps>=3&&!anyGood:k==="stood"?!anyGood:true)),   // 잘 풀린 날은 충돌 몇 번으로 다짐하지 않는다
    badEv=bad&&uniq.find(e=>e.k===bad);
  const tk=bad&&DIARY_TAIL[bad]?bad:anyGood?"good":"plain";
  const tail=diaryFill(diaryPick("tail_"+tk,DIARY_TAIL[tk]),badEv||{});
  saveProfile();
  return {week:run.week,day:DAYS[run.day],am,lb,mod:mk,from,to,head,lines,tail,fail:!!fail,melt:g.meltdowns>0,combo:run.combo||0,
    stickers:g.dp.filter(d=>d.status==="done"||d.status==="fail").map(d=>({n:d.n,ok:d.status==="done"}))};
}
const MOD_ICON={normal:"",rain:"☂ 비",delay:"⏱ 지연",quiet:"☀ 한산",packed:"▣ 만원"};
function diaryHTML(d){
  return `<div class="diary${d.melt?" shaky":""}${d.fail?" cut":""}"><div class="dh">${d.week}주차 ${d.day} · ${d.lb||(d.am?"출근":"퇴근")} ${MOD_ICON[d.mod]}<span>${d.from} ━━▶ ${d.to}</span></div>
   <p class="dl">${d.head}</p>${d.lines.map(l=>`<p class="dl">${l}</p>`).join("")}<p class="dl dt">${d.tail}</p>

function backpackTurn(p){   // 가방을 멘 채 몸을 돌린다. 돌기 전에 등 뒤에 있던 사람이 밀린다
  const g=G,P=g.pl,bx=-Math.cos(p.face),by=-Math.sin(p.face),dx=P.x-p.x,dy=P.y-p.y,d=hyp(dx,dy)||1;
  p.face+=(Math.random()<.5?1:-1)*rand(1.9,3.1);p.bpT=rand(4,7);p.bpWarn=false;
  if(P.seat||P.into||d>34||(dx*bx+dy*by)/d<.2)return;
  const k=gritK()*(1-.5*brK());   // 사람이 미는 힘: 버티기로 줄고 손잡이는 절반만 막는다 (휴대용 손잡이는 그 절반)
  P.vx+=dx/d*210*k;P.y+=dy/d*12*k;constrain(P);
  g.stamina-=bumpDmg();g.bumps++;g.packHits++;g.shake=Math.max(g.shake,.18);if(!g.bump1)g.bump1=g.route[Math.min(g.N,g.st+(g.phase==="run"?1:0))];

}

function updateSpecials(dt){
  const g=G;
  for(const p of g.ps){
    if(!p.sp)continue;
    if(!p.spSeen&&(p.vis||0)>.6){p.spSeen=true;const d=dex(p.sp);   // 처음 만난 유형은 독백으로 소개한다
      if(!d.met){say(g.pl,SP_INFO[p.sp].mono);g.pl.bt=2.6;toast("처음 보는 승객: "+SP_INFO[p.sp].n+". "+SP_INFO[p.sp].card);ev(p.sp==="backpack"?"metBackpack":p.sp==="sprawl"?"metSprawl":"met_"+p.sp);}
      d.met++;saveProfile();}
    if(p.sp==="backpack"&&p.state==="standing"&&!p.bpFront&&p.delay==null){
      p.bpT-=dt;if(p.bpT<=.6)p.bpWarn=true;   // 돌기 0.6초 전에 어깨를 들썩인다
      if(p.bpT<=0)backpackTurn(p);
    }
    if(p.sp==="drunk"){const P=g.pl;
      if(p.state==="seated"&&p.dest!==99)p.dest=99;   // 앉으면 졸다 종점까지
      p.mumT-=dt;if(p.mumT<=0){p.mumT=rand(5,9);if(!p.bubble)say(p,pick(DRUNK_LINES)),p.bt=2;}
      if(p.state==="standing"&&p.delay==null){
        p.sway=Math.sin(performance.now()/1000*2.6+p.ph)*9;   // A. 제자리에서 좌우로 크게 비틀거린다
        if(p.lurch>0){p.lurch-=dt;p.x+=p.ldir*90*dt;const h={x:p.x,y:p.y};constrain(h);p.x=h.x;p.y=h.y;p.hx=p.x;p.hy=p.y;}
        else if(!p.contend&&!p.slot){p.drT-=dt;if(p.drT<=0){p.drT=rand(2.5,4.5);p.dzDir=-p.dzDir;const h={x:p.x+p.dzDir*rand(24,46),y:(p.y<(AY0+AY1)/2?AY1:AY0)+rand(-8,8)};constrain(h);p.hx=h.x;p.hy=h.y;p.wt=9;}}   // 통로를 지그재그로 오간다
        const nj=g.phase==="run"&&g.jolts.find(j=>!j.done&&g.t>=j.at-.7&&g.t<j.at);p.drWarn=!!nj;   // 쏠리기 0.7초 전에 어깨가 들썩인다
      }
      if(!P.seat&&hyp(P.x-p.x,P.y-p.y)<DRUNK_R){g.stamina-=dt;if(!g.drSaid){g.drSaid=1;g.fx.push({x:P.x,y:P.y-26,t:0,txt:"취객 곁 · 체력 초당 -1"});}}   // 민폐 게이지가 아니라 체력
    }
    if(p.sp==="call"&&p.state==="seated"){p.callT-=dt;if(p.callT<=0){p.callT=rand(3.5,6.5);if(!eq("earphone")){say(p,pick(CALL_LINES));p.bt=2.6;}}}
  }
  const c=g.carrier;
  if(c){const o=c.owner,P=g.pl;
    if(!g.ps.includes(o)||o.state==="gone"){g.carrier=null;return;}   // 주인이 내렸다
    if(c.roll>0){c.roll-=dt;c.x+=c.vx*dt;c.vx*=Math.pow(.3,dt);const h={x:c.x,y:c.y};constrain(h);if(Math.abs(h.x-c.x)>.5)c.vx*=-.3;c.x=h.x;c.y=h.y;
      if(!P.seat&&!c.hit&&Math.abs(c.vx)>40&&hyp(P.x-c.x,P.y-c.y)<20){c.hit=true;carrierHit();}
      if(c.roll<=0){c.vx=0;o.hx=c.x-16;o.hy=c.y;o.wt=4;}}   // 멈추면 주인이 가지러 온다
    else if(o.state==="leaving"||hyp(o.x+16-c.x,o.y-c.y)<34){const k=Math.min(1,dt*6);c.x+=(o.x+16-c.x)*k;c.y+=(o.y-c.y)*k;}   // 주인 옆에 붙어 다닌다
    if(!P.seat){const dx=P.x-c.x,dy=P.y-c.y,d=hyp(dx,dy);if(d<18&&d>.01){P.x=c.x+dx/d*18;P.y=c.y+dy/d*18;constrain(P);}}   // 세워 둔 캐리어는 통로 한 칸을 막는다
  }
}

const CAR={x:60,y:240,w:1160,h:260};
const SEAT_W=34,SEAT_D=38,DOOR_W=90,BENCH=7,BW=BENCH*SEAT_W;
const X0=CAR.x+43;
const DOORS=[0,1,2,3].map(i=>({i,x:X0+i*(DOOR_W+BW),cx:X0+i*(DOOR_W+BW)+DOOR_W/2}));
const TOP_Y=CAR.y+8+SEAT_D/2, BOT_Y=CAR.y+CAR.h-8-SEAT_D/2;
const AY0=CAR.y+8+SEAT_D+15, AY1=CAR.y+CAR.h-8-SEAT_D-15;     // 통로(좌석 앞) 이동 범위
const BY0=CAR.y+8+13, BY1=CAR.y+CAR.h-8-13;                    // 출입문 앞 공간 이동 범위
/* 손잡이 위치 (개선점): 좌석 앞 손잡이 줄(3D의 손잡이 봉 아래)과 출입문 양옆 기둥에서만 잡을 수 있다 */
const POLE_Y=[370-85,370+85];
const brK=()=>G.pl.brace?1:G.pl.grip?.5:0;   // 손잡이 효과: 손잡이 1, 휴대용 손잡이 0.5
function nearPole(x,y){for(const d of DOORS)for(const px of[d.x,d.x+DOOR_W])for(const py of POLE_Y)if(Math.abs(x-px)<22&&Math.abs(y-py)<30)return true;return false;}   // 출입문 옆 기둥
function nearHandle(x,y){
  for(let b=0;b<3;b++){const x0=DOORS[b].x+DOOR_W;if(x>x0-4&&x<x0+BW+4&&(Math.abs(y-AY0)<26||Math.abs(y-AY1)<26))return true;}
  for(const d of DOORS)for(const px of[d.x,d.x+DOOR_W])for(const py of POLE_Y)if(Math.abs(x-px)<22&&Math.abs(y-py)<30)return true;
  return false;
}
const BAYS=DOORS.map((d,i)=>[i===0?CAR.x+16:d.x+5, i===3?CAR.x+CAR.w-16:d.x+DOOR_W-5]);
function constrain(e){
  e.x=clamp(e.x,CAR.x+16,CAR.x+CAR.w-16);
  if(e.y<AY0||e.y>AY1){
    let ok=false;
    for(const b of BAYS){
      if(e.x>=b[0]-10&&e.x<=b[1]+10){if(e.x<b[0]||e.x>b[1]){e.x=clamp(e.x,b[0],b[1]);e.y+=e.y<AY0?2.4:-2.4;}ok=true;break;}
    }
    if(ok)e.y=clamp(e.y,BY0,BY1);else e.y=clamp(e.y,AY0,AY1);
  }
}
function makeSeats(){
  const s=[];
  for(let b=0;b<3;b++)for(const side of["top","bot"])for(let k=0;k<BENCH;k++){
    const x=DOORS[b].x+DOOR_W+SEAT_W*(k+.5);
    const pink=(side==="top"&&k===0)||(side==="bot"&&k===BENCH-1);
    s.push({id:s.length,k,x,y:side==="top"?TOP_Y:BOT_Y,fx:x,fy:side==="top"?AY0+2:AY1-2,side,pink,occ:null,zone:b});
  }
  return s;
}

function destW(arch,legKey,name){   // 이 유형이 이 역에서 내릴 가중치. 기존 구간은 원래 값, 그 밖은 예외 역 → 구간 → 환승 등급
  const w=ARCH[arch][legKey]||ARCH[arch].pm;if(w[name]!=null)return w[name];if(CORE.has(name))return 0;
  const zz=ARCH_Z[arch]||{},z=zz[legKey]||zz.pm||{};if(z[name]!=null)return z[name];   // 주말은 퇴근 가중치를 쓴다
  if(arch==="transfer"){const gr=XFER[name];return gr==="S"?5:gr==="A"?3:gr==="B"?1.5:0;}   // 환승 검색: 환승역일수록
  return z[ST[name]&&ST[name].zone]||0;
}
function sampleDest(arch,legKey,route,from){
  const w=ARCH[arch][legKey]||ARCH[arch].pm,opts=[];
  for(let i=from+1;i<route.length;i++){let v=destW(arch,legKey,route[i]);if(v>0&&G&&G.evSt===route[i])v*=2;if(v>0)opts.push([i,v]);}   // 행사 역은 내리는 사람이 2배
  if(w.any)for(let i=from+1;i<route.length;i++)opts.push([i,w.any/(route.length-1)]);
  if(w.beyond)opts.push([99,w.beyond]);
  if(!opts.length)return 99;
  let t=0;for(const o of opts)t+=o[1];let r=Math.random()*t;
  for(const o of opts){r-=o[1];if(r<=0)return o[0];}
  return 99;
}
function likelyStops(p){   // 관찰력 1단계 카드: 이 유형이 자주 내리는 역 후보 2곳 (노선 순서로, 어느 쪽이 더 유력한지는 알려 주지 않는다)
  const w=ARCH[p.arch][G.legKey]||ARCH[p.arch].pm,c=[];
  for(let i=G.st+1;i<G.route.length;i++){const v=destW(p.arch,G.legKey,G.route[i]);if(v>0)c.push([i,v]);}
  if(!c.length)return null;
  const top=c.sort((a,b)=>b[1]-a[1]).slice(0,2).sort((a,b)=>a[0]-b[0]).map(x=>G.route[x[0]]);
  return top.length>1?top.join(" 또는 "):top[0]+(w.beyond?" 또는 더 멀리":" 쪽");
}
function likelyStop(p){
  const w=ARCH[p.arch][G.legKey];let best=null,bw=0;
  for(const k in w)if(k!=="beyond"&&k!=="any"&&w[k]>bw&&G.route.indexOf(k)>G.st){best=k;bw=w[k];}
  return best;
}

function tellAt(p){return (ARCH[p.arch].late?.86:[.6,.45,.3,.12][sk("obs")]+p.jit)+(eq("shades")?.3/runT():0)-.5*(stat("eye")-3)/runT();}   // 눈치 1당 0.5초   // 선글라스: 0.3초 늦게
const NOH={stage:0,icon:null,real:false};
function hint(p){ // 좌석 승객이 지금 보이는 낌새
  if(p.state!=="seated"||p.rush||p.hide>0)return NOH;   // 눈이 마주친 승객은 잠시 낌새를 감춘다
  const g=G;
  if(p.dest===g.st&&g.phase==="dwell"&&p.delay!=null)return {stage:2,icon:"stand",real:true};
  if(g.phase!=="run")return NOH;
  const prog=g.t/runT();
  if(p.preTell&&p.dest>g.st)return {stage:1,icon:p.kind,real:true};   // 눈치 계열 7단계: 처음부터 보이는 낌새
  if(p.dest===g.st+1){
    const a=tellAt(p);
    if(prog>=Math.max(a+.2,.8))return {stage:2,icon:"stand",real:true};
    if(prog>=a)return {stage:1,icon:p.kind,real:true};
  }else if(p.fakeT>0)return {stage:1,icon:p.kind,real:false};
  if(g.t>1&&g.t<2.9&&(p.dest===g.st+1?p.glance:p.fg===g.st))return {stage:.5,icon:"look",real:p.dest===g.st+1};
  return NOH;
}
function tellState(p){const h=hint(p);return h.stage>=1?(h.real?1:2):0;} // 0 없음, 1 진짜, 2 페이크
function standUp(p){
  // 일어난 사람은 좌석 바로 앞에서 출구(좌석 앞 자리)가 비기를 기다린다
  if(p.sp==="sprawl")for(const o of G.seats)if(o.narrow===p)o.narrow=null;   // 넓게 앉은 승객이 내리면 옆자리는 보통 자리가 된다
  const s=p.seat;s.occ=null;p.seat=null;p.x=s.x;p.y=s.side==="top"?s.fy-12:s.fy+12;p.state="leaving";
  {const ci=G.claims.findIndex(c=>c.pid===p.id);if(ci>=0){const c=G.claims.splice(ci,1)[0];if(c.st===G.st&&++G.eyeHits>=1)dpSet("eye",true);}}p.step=-1;p.exitSeat=s;p.wait=0;p.said=0;p.delay=null;
  let d=DOORS[0];for(const q of DOORS)if(Math.abs(q.cx-p.x)<Math.abs(d.cx-p.x))d=q;p.door=d;
  s.exiting=p;

function updateGaze(rdt){

function updateSight(rdt){
  const P=G.pl;let best=null,bs=1e9;
  const hov=mouse.inside?personAt(mouse.x,mouse.y):null;   // 마우스로 가리킨 사람이 보이면 그 사람을 본다
  for(const p of G.ps){
    p.vis=clamp((p.vis||0)+(seesRaw(p)?rdt*6:-rdt*3),0,1);
    if(mouse.inside)continue;
    if(p.vis<.6||p.state==="gone")continue;
    const dx=p.x-P.x,dy=p.y-P.y,sc=Math.abs(angDiff(Math.atan2(dy,dx),P.gaze))*260+hyp(dx,dy)*.5+(p.state==="seated"?0:70)-(p===focus?45:0);  // 보던 사람을 계속 보도록
    if(sc<bs){bs=sc;best=p;}
  }
  if(mouse.inside)best=hov&&hov.vis>.5&&hov.state!=="gone"?hov:null;
  if(best!==focus){focus=best;focusT=0;}else focusT+=rdt;
  if(focus&&focusT>=.5&&dpGet("scan")){G.scanned.add(focus.id);if(G.scanned.size>=5)dpSet("scan",true);}
}

function drawFocus(time,q){ // 보고 있는 승객 표시

    ctx.beginPath();ctx.moveTo(cx-sx*8,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy-sy*8);ctx.stroke();}
  for(const o of G.ps){if(o.state!=="seated"||!(o.gz>.05)||(o.vis||0)<.3)continue;   // 시선 게이지
    const f=Math.min(1,o.gz/3),gy=o.seat.side==="top"?o.y-30:o.y+30;ctx.lineWidth=4;ctx.strokeStyle="rgba(20,24,28,.25)";ctx.beginPath();ctx.arc(o.x,gy,8,0,TAU);ctx.stroke();

}
function steer(p,tx,ty,sp,dt,movers,sep){
  let dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy),vx=0,vy=0;
  if(d>2.5){vx=dx/d*sp;vy=dy/d*sp;}
  for(const q of movers){
    if(q===p||q.state==="boarding"&&q.step===0)continue;
    const ex=p.x-q.x,ey=p.y-q.y,e=hyp(ex,ey);
    if(e<27&&e>.01){const f=(27-e)*(sep?5:2.2);vx+=ex/e*f;vy+=ey/e*f;}
  }
  p.x+=vx*dt;p.y+=vy*dt;constrain(p);
  if(hyp(vx,vy)>12)p.face=Math.atan2(vy,vx);
}

function hintIcon(x,y,h,time){

  ctx.fillStyle="#14181c";ctx.lineWidth=1.5;

    case"bag":rr(x-6,y-2,12,8,2);ctx.fill();ctx.beginPath();ctx.arc(x,y-2,3.5,Math.PI,0);ctx.stroke();break;

function personAtQ(x,y){
  for(const s of G.seats)if(s.occ&&s.occ!=="player"&&Math.abs(x-s.x)<SEAT_W/2&&y>s.y-40&&y<s.y+SEAT_D/2+6)return s.occ;
  let best=null;
  for(const p of G.ps)if(p.state!=="seated"&&Math.abs(x-p.x)<12&&y>p.y-45&&y<p.y+11&&(!best||p.y>best.y))best=p;

// 앉은 승객의 지금 행동. 낌새는 아이콘이 아니라 몸짓으로 보여준다 (시야 밖이면 평소 모습)
function seatAct(p,time){
  if(!G||p.state!=="seated"||(p.vis||0)<.4)return {k:"idle",pr:0};
  const h=hint(p);
  if(h.stage>=2)return {k:"stand",pr:1};
  if(h.stage>=1)return {k:h.icon,pr:h.real?1:.5+.5*Math.sin(time*2.4+p.ph)};   // 페이크는 하다 말다 한다
  if(h.stage===.5)return {k:"glance",pr:1};

  <p class="sub">산 아이템은 계속 가지고 있습니다. 출근 전에 집에서 챙겨 나갑니다. 진열은 한 주가 끝날 때마다 바뀝니다 (월급날 뒤에는 6개).</p>
  ${(profile.stock||[]).map(k=>card(IT(k))).join("")||'<p class="sub">진열된 물건을 모두 샀습니다.</p>'}
  ${mine.length?`<h3>가지고 있는 아이템</h3><p class="sub">${mine.map(i=>i.n).join(", ")}</p>`:""}
  <div class="btns">${typeof after==="function"?`<button class="btn go" id="b1">${after===showCard?"집으로 돌아가기":run?"주말로 돌아가기":"돌아가기"}</button>`:'<button class="btn go" id="b1">월요일 출근하기</button><button class="btn ghost" id="b2">처음으로</button>'}</div>`);
  document.querySelectorAll(".skill .btn").forEach(b=>b.onclick=()=>{const i=IT(b.dataset.k);if(profile.items.includes(i.k)||i.p>profile.points)return;
    profile.points-=i.p;profile.items.push(i.k);saveProfile();sfx("good");toast(i.n+"을(를) 샀습니다. 출근 전에 챙길 수 있습니다.","good");showItemShop(after);});
  if(typeof after==="function")$("b1").onclick=after;else{$("b1").onclick=startRun;$("b2").onclick=showMenu;}if(!run)$("tabSkill").onclick=()=>showShop(after);
}
function setPause(v){
  if(mode!=="play")return;paused=v;annPause(v);
  if(v){sheet(`<h2>일시정지</h2><p class="sub">WASD 이동 · 마우스 시선 · F 보고 있는 자리 찜 · E 앉기/일어서기/양보 · 우클릭/Shift 손잡이${sk("excuse")?" · Q 잠시만요":""}${eq("pack")?" · T 가방 앞으로":""}${eq("coffee")?" · C 커피":""}</p>
    <div class="btns"><button class="btn go" id="b1">계속하기</button><button class="btn ghost" id="bg">가이드</button>${G&&G.tut&&!G.tut.skip?`<button class="btn ghost" id="bt">튜토리얼 건너뛰기</button>`:""}<button class="btn ghost" id="b2">이번 주 포기</button></div>`);
    $("b1").onclick=()=>setPause(false);if($("bt"))$("bt").onclick=()=>{G.tut.skip=true;G.tut.hold=false;setPause(false);};$("bg").onclick=()=>showGuide(()=>setPause(true));$("b2").onclick=()=>{paused=false;finishRun("quit");};}
  else $("ov").classList.remove("on");
}

/* ========== 안내방송 (음성) ==========
   audio/announce/<역명>.mp3 파일이 있으면 그 녹음을 틀고, 없으면 브라우저 음성(TTS)으로 2호선 형식 안내를 읽는다.
   M 키로 켜고 끈다. */
const ANN_EN={"신림":"Sillim","봉천":"Bongcheon","서울대입구":"Seoul National University","낙성대":"Nakseongdae","사당":"Sadang","방배":"Bangbae","서초":"Seocho","교대":"Seoul National University of Education","강남":"Gangnam","역삼":"Yeoksam","선릉":"Seolleung","삼성":"Samseong","종합운동장":"Sports Complex","잠실새내":"Jamsilsaenae","잠실":"Jamsil","잠실나루":"Jamsillaru","강변":"Gangbyeon","구의":"Guui","건대입구":"Konkuk University","성수":"Seongsu","뚝섬":"Ttukseom","한양대":"Hanyang University","왕십리":"Wangsimni","상왕십리":"Sangwangsimni","신당":"Sindang","동대문역사문화공원":"Dongdaemun History and Culture Park","을지로4가":"Euljiro 4-ga","을지로3가":"Euljiro 3-ga","을지로입구":"Euljiro 1-ga","시청":"City Hall","충정로":"Chungjeongno","아현":"Ahyeon","이대":"Ewha Womans University","신촌":"Sinchon","홍대입구":"Hongik University","합정":"Hapjeong","당산":"Dangsan","영등포구청":"Yeongdeungpo-gu Office","문래":"Mullae","신도림":"Sindorim","대림":"Daerim","구로디지털단지":"Guro Digital Complex","신대방":"Sindaebang"};
const ANN_XFER=Object.fromEntries(LINE2.filter(o=>o.tr.length).map(o=>[o.n,o.tr.join(", ")]));
const ANN_XFER_EN={"신림":"the Sillim Line","사당":"Line 4","교대":"Line 3","강남":"the Shinbundang Line","시청":"Line 1","을지로3가":"Line 3","을지로4가":"Line 5","동대문역사문화공원":"Line 4 and Line 5","신당":"Line 6","왕십리":"Line 5, the Gyeongui-Jungang Line and the Suin-Bundang Line","건대입구":"Line 7","잠실":"Line 8","종합운동장":"Line 9","선릉":"the Suin-Bundang Line","대림":"Line 7","신도림":"Line 1","영등포구청":"Line 5","당산":"Line 9","합정":"Line 6","홍대입구":"the Airport Railroad and the Gyeongui-Jungang Line","충정로":"Line 5"};
let annAudio=null,annVoices=[];
function annLoadVoices(){try{annVoices=speechSynthesis.getVoices();}catch(e){}}
if(window.speechSynthesis){annLoadVoices();speechSynthesis.onvoiceschanged=annLoadVoices;}
function annVoice(lang){
  const vs=annVoices.filter(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang));
  const pref=lang==="ko"?/SunHi|Heami|Yuna|Google|Natural/i:/Jenny|Aria|Samantha|Google US|Natural|Zira/i;
  return vs.find(v=>pref.test(v.name))||vs[0]||null;
}
function annSay(text,lang,onend){
  const v=annVoice(lang);if(!v)return false;
  const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=lang==="ko"?1.05:1;u.pitch=1.05;u.volume=.9;
  if(onend)u.onend=onend;
  speechSynthesis.speak(u);return true;
}
/* 목적지 도착 음악: 광주교통공사 전동차 내 안내방송 음원 D02(국악신호음악 '벨소리2') 앞부분, 음성 안내 전까지만.
   출처: 광주교통공사, 공공데이터포털(data.go.kr/data/15053587), 이용허락범위 제한 없음 */
const ARRIVE_MUSIC={src:"audio/arrive_gwangju_D02.mp3",from:.4,len:7,fade:1.8};   // 0~13.5초가 종소리 음악(약 3.3초 마디 반복), 15초부터 녹동역 음성
let arriveAud=null,arriveFadeT=null,arrivePre=null;
function preloadArriveMusic(){try{if(!arrivePre){arrivePre=new Audio(ARRIVE_MUSIC.src);arrivePre.preload="auto";arrivePre.load();}}catch(e){}}
function playArriveMusic(){
  if(profile.voice===false)return;stopArriveMusic();
  const a=arrivePre||new Audio(ARRIVE_MUSIC.src);arrivePre=null;a.volume=.8;arriveAud=a;
  try{a.currentTime=ARRIVE_MUSIC.from;}catch(e){}
  a.play().catch(()=>{if(arriveAud===a)arriveAud=null;});
  arriveFadeT=setInterval(()=>{if(arriveAud!==a){clearInterval(arriveFadeT);return;}
    const left=ARRIVE_MUSIC.from+ARRIVE_MUSIC.len-a.currentTime;if(left<=0){stopArriveMusic();return;}
    if(left<ARRIVE_MUSIC.fade)a.volume=Math.max(0,.8*left/ARRIVE_MUSIC.fade);},100);
}
/* 역 신호음 (개선점: "띵띵띵" 교체): 도착 음악과 같은 광주교통공사 D02 음원의 첫 마디만 짧게. 불러오지 못하면 예전 합성음 */
const BELL={from:.4,len:1.6,fade:.7,vol:.42};let bellAud=null,bellT=null;
function bell(){
  try{if(bellAud){bellAud.pause();clearInterval(bellT);}
    const a=new Audio(ARRIVE_MUSIC.src);a.volume=BELL.vol;bellAud=a;try{a.currentTime=BELL.from;}catch(e){}
    a.play().catch(()=>{if(bellAud===a){bellAud=null;sfx("chime");}});
    bellT=setInterval(()=>{if(bellAud!==a){clearInterval(bellT);return;}const left=BELL.from+BELL.len-a.currentTime;
      if(left<=0){a.pause();bellAud=null;clearInterval(bellT);return;}if(left<BELL.fade)a.volume=Math.max(0,BELL.vol*left/BELL.fade);},60);
  }catch(e){sfx("chime");}
}
function stopArriveMusic(){clearInterval(arriveFadeT);if(arriveAud){try{arriveAud.pause();}catch(e){}arriveAud=null;}}
const ANN_FILES=new Set([]);   // audio/announce/<역명>.mp3 녹음을 넣은 역 이름을 여기에 적는다 (없는 파일은 찾지 않음)
let annTok=0;
function announceNext(name,last){
  if(profile.voice===false)return;
  annStop();const tok=++annTok;
  if(ANN_FILES.has(name)){
    annAudio=new Audio("audio/announce/"+encodeURIComponent(name)+".mp3");annAudio.volume=.9;
    annAudio.play().catch(()=>{if(tok!==annTok)return;annAudio=null;annTTS(name,tok);});
  }else annTTS(name,tok);
}
function annTTS(name,tok){   // 한국어 안내는 짧게, 영어는 도착 전에 끝낼 시간이 남을 때만
  if(!window.speechSynthesis)return;
  const x=ANN_XFER[name];
  const en=ANN_EN[name],enTxt=en&&"This stop is "+en+". The doors are on your right.";
  const ok=annSay("이번 역은 "+name+", "+name+"역입니다."+(x?" "+x+"으로 갈아타실 수 있습니다.":"")+" 내리실 문은 오른쪽입니다.","ko",()=>{
    if(tok!==annTok||!enTxt||!G||G.phase!=="run")return;
    if(runT()-G.t>=1+enTxt.length*.07)annSay(enTxt,"en");
  });
  if(!ok&&enTxt)annSay(enTxt,"en");
}
function annStop(){annTok++;try{if(annAudio){annAudio.pause();annAudio=null;}if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}
function annPause(v){try{if(annAudio)v?annAudio.pause():annAudio.play().catch(()=>{});if(window.speechSynthesis)v?speechSynthesis.pause():speechSynthesis.resume();}catch(e){}}

/* ========== 소리 (간단한 합성음) ========== */
let AC=null;
function sfx(k){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const t=AC.currentTime,tone=(f,d,at,type,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
      g.gain.setValueAtTime(v||.06,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+at+d);o.connect(g).connect(AC.destination);o.start(t+at);o.stop(t+at+d);};
    if(k==="chime"){tone(784,.25,0);tone(659,.25,.18);tone(523,.4,.36);}
    else if(k==="close"){tone(880,.12,0);tone(880,.12,.2);}
    else if(k==="bump")tone(120,.15,0,"square",.05);
    else if(k==="jolt")tone(70,.25,0,"sawtooth",.05);
    else if(k==="good"){tone(660,.12,0);tone(990,.2,.1);}
    else if(k==="bad"){tone(300,.18,0,"triangle");tone(220,.3,.14,"triangle");}
    else if(k==="tick")tone(1200,.05,0,"square",.025);
    else if(k==="buzz"){tone(140,.09,0,"square",.03);tone(140,.09,.14,"square",.03);}
    else if(k==="train"||k==="door"){const o=AC.createOscillator(),g=AC.createGain(),tr=k==="train",d=tr?3.3:.75;o.type=tr?"sawtooth":"triangle";   // 열차 진입음(낮아지는 굉음), 문 열림(공기 빠지는 소리)
      o.frequency.setValueAtTime(tr?200:520,t);o.frequency.exponentialRampToValueAtTime(tr?65:160,t+d);g.gain.setValueAtTime(tr?.0001:.05,t);if(tr)g.gain.exponentialRampToValueAtTime(.035,t+.8);g.gain.exponentialRampToValueAtTime(.0001,t+d+.1);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.15);}
  }catch(e){}
}

/* ========== 입력 ========== */
const DEBUG=(()=>{try{return /[?&]debug=1(&|$)/.test(location.search);}catch(e){return false;}})();   // 개선점: 멘붕 재현용 시험 키
addEventListener("keydown",e=>{
  if(["Tab","Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
  if(e.repeat)return;keys[e.code]=true;
  if(DEBUG&&G&&mode==="play"){   // 시험용 키 (주소 뒤에 ?debug=1): 1 붕괴 스택 +1, 2 체력 -20, 3 민폐 +20
    if(e.code==="Digit1"){addCollapse();toast("[시험] 붕괴 스택 +1");return;}
    if(e.code==="Digit2"){G.stamina=Math.max(1,G.stamina-20);toast("[시험] 체력 -20");return;}
    if(e.code==="Digit3"){G.nuis=Math.min(99,G.nuis+20);toast("[시험] 민폐 +20");return;}}
  if(e.code==="Tab"){e.preventDefault();if(mode==="play"){profile.dpFold=!profile.dpFold;saveProfile();if(G&&G.tut)G.tut.tab++;}return;}   // 계획표 접기
  if(e.code==="Escape"||e.code==="KeyP"){if(mode==="play")setPause(!paused);return;}
  if(mode!=="play"||paused)return;
  if(e.code==="KeyE"){if(catchCarrier())return;trySit(null);}
  if((e.code==="KeyA"||e.code==="KeyD")&&G&&!G.pl.seat){   // 내리는 사람 앞이면 A/D는 이동 대신 몸을 90도 돌려 길을 터 준다
    const P=G.pl,s=G.seats.find(x=>x.exiting&&Math.abs(P.x-x.fx)<14&&Math.abs(P.y-x.fy)<24);
    if(s)turnBody(s,(e.code==="KeyD"?1:-1)*(view==="q"&&-Math.sin(P.gaze)<0?-1:1));
  }
  const ga={ArrowRight:0,ArrowDown:Math.PI/2,ArrowLeft:Math.PI,ArrowUp:-Math.PI/2}[e.code];
  if(ga!=null&&G&&view!=="q"){G.pl.gazeT=ga;G.pl.gazeHold=2;}   // 탑뷰: 짧게 눌러도 바로 돌아보게
  if(e.code==="KeyF"&&focus&&focus.state==="seated")togglePlan(focus.seat);
  if(e.code==="KeyQ")excuse();
  if(e.code==="KeyB"&&G&&CH().k==="oh"&&!G.jumped&&G.st===0&&G.phase==="dwell"&&!G.pl.seat){G.jumped=true;jumpBoard();}
  if(e.code==="KeyX"&&G&&G.pl.seat&&!G.yieldEv&&G.st<G.N-1){G.ff=!G.ff;toast(G.ff?"앉은 채 도착까지 건너뜁니다 (X로 멈춤). 양보할 일이 생기면 멈춥니다.":"건너뛰기를 멈췄습니다.");}
  if(e.code==="KeyT"&&eq("pack")&&G&&!G.pl.seat){G.pl.packFront=!G.pl.packFront;toast(G.pl.packFront?"가방을 앞으로 멨습니다 (이동 속도 -5%).":"가방을 다시 뒤로 멨습니다.");sfx("tick");}
  if(e.code==="KeyC"&&eq("coffee")&&G){if(G.coffeeUsed)toast("커피는 이미 다 마셨습니다.");else{G.coffeeUsed=true;G.coffeeT=30;G.stamina=Math.min(maxSta(),G.stamina+10);toast("커피 한 모금. 체력 +10. 30초 동안은 부딪히지 않게 조심.","good");sfx("good");}}
  if(e.code==="KeyM"){profile.voice=profile.voice===false;saveProfile();if(profile.voice===false){annStop();stopArriveMusic();}toast(profile.voice===false?"안내방송: 끔":"안내방송: 켬");}
  if(e.code==="KeyV"){view=view==="q"?"t":"q";profile.view=view;saveProfile();toast(view==="q"?"시점: 3D":"시점: 탑뷰");if(view!=="q"&&document.pointerLockElement)document.exitPointerLock();}
});
addEventListener("keyup",e=>{keys[e.code]=false;});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;});
const frame=$("frame");
function toWorld(e){const r=frame.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
let pitch3=0;
const locked=()=>document.pointerLockElement===frame;
frame.addEventListener("mousemove",e=>{
  if(view==="q"){if(locked()&&G&&mode==="play"&&!paused){G.pl.gazeT+=e.movementX*.0026;pitch3=clamp(pitch3+e.movementY*.002,-.55,.5);}return;}
  const p=toWorld(e);mouse.x=p.x;mouse.y=p.y;mouse.inside=true;});
frame.addEventListener("mouseleave",()=>{mouse.inside=false;});
frame.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("mouseup",e=>{if(e.button===2)keys.Mouse2=false;});
frame.addEventListener("mousedown",e=>{   // 3D에서 마우스가 잠기면 클릭이 잠금 대상(frame)으로 온다. 그래서 cv가 아니라 frame에서 받는다
  if(mode!=="play"||paused)return;
  if(!locked()&&e.target!==cv&&e.target.id!=="gl")return;   // 잠기지 않았을 때는 화면(캔버스)을 누른 것만
  if(e.button===2){   // 우클릭을 누르고 있는 동안 손잡이를 잡는다 (Shift·Space와 같음)
    e.preventDefault();if(view==="q"&&!locked()&&frame.requestPointerLock)frame.requestPointerLock();
    keys.Mouse2=true;return;}
  if(e.button!==0)return;
  if(view==="q"){   // 3D: 좌클릭은 마우스 잠금만 한다. 찜은 F (2026-11-26 결정: 좌클릭 찜 없앰)
    if(!locked()){frame.requestPointerLock&&frame.requestPointerLock();return;}
    return;}
  const p=toWorld(e),s=seatAt(p.x,p.y);if(!s)return;
  if(!s.occ)trySit(s);   // 탑뷰: 빈자리를 누르면 앉으러 간다 (찜은 F)
});
document.addEventListener("pointerlockchange",()=>{if(!locked()&&view==="q"&&mode==="play"&&!paused)setPause(true);});   // Esc로 잠금이 풀리면 일시정지
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);frame.style.transform="scale("+s+")";}
addEventListener("resize",fit);fit();

/* ========== 루프 ========== */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==="play"&&!paused&&G){
    if(G.ff&&(!G.pl.seat||G.yieldEv||G.st>=G.N)){G.ff=false;if(G.yieldEv)toast("건너뛰기를 멈췄습니다. 앞에 양보할 분이 있습니다.");}
    for(let i=0,n=G.ff?6:1;i<n&&mode==="play"&&G;i++)update(dt);}   // 앉은 채 도착 건너뛰기: 6배로 감는다 (앉으면 원래 3배)
  draw(now/1000);hud();
  requestAnimationFrame(loop);
}
if(profile.seenIntro==null&&profile.runs>0){profile.seenIntro=true;profile.seenHelp=true;saveProfile();}   // 인트로가 생기기 전부터 하던 사람: 짧은 인트로, 튜토리얼 없음
introPlay(!profile.seenIntro);requestAnimationFrame(loop);
</script>
